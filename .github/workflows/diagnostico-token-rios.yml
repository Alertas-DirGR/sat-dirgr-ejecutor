name: SAT DirGR Rios - Diagnostico Token

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest

    steps:
      - name: Diagnosticar identidad y acceso del token Rios
        shell: bash
        env:
          RIOS_TOKEN: ${{ secrets.RIOS_REPO_TOKEN_FINAL_TEST }}
        run: |
          echo "=== IDENTIDAD DEL TOKEN ==="

          USER_HTTP=$(curl -sS \
            -o usuario.json \
            -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${RIOS_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/user)

          echo "HTTP_USUARIO=$USER_HTTP"

          if [ "$USER_HTTP" = "200" ]; then
            LOGIN=$(node -e "const x=require('./usuario.json'); console.log(x.login)")
            echo "LOGIN_AUTENTICADO=$LOGIN"
          fi

          echo "=== REPOSITORIOS VISIBLES ==="

          curl -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${RIOS_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/user/repos?per_page=100&visibility=all" \
            -o repos.json

          node -e "
            const fs=require('fs');
            const x=JSON.parse(fs.readFileSync('repos.json','utf8'));
            if (Array.isArray(x)) {
              x.forEach(r => console.log('REPO_VISIBLE=' + r.full_name));
            } else {
              console.log('RESPUESTA_REPOS=' + JSON.stringify(x));
            }
          "

          echo "=== PRUEBA DIRECTA RIOS ==="

          HTTP_CODE=$(curl -sS \
            -o respuesta.json \
            -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${RIOS_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/repos/Alertas-DirGR/sat-dirgr-rios)

          echo "HTTP_RIOS=$HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "ACCESO_RIOS=OK"
          else
            echo "ACCESO_RIOS=NO"
          fi
