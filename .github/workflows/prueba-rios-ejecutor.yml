name: SAT DirGR Rios - Prueba Ejecutor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prueba:
    name: Verificar ejecutor publico de Rios
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar codigo privado de Rios
        uses: actions/checkout@v5
        with:
          repository: Alertas-DirGR/sat-dirgr-rios
          token: ${{ secrets.RIOS_REPO_TOKEN }}
          path: rios

      - name: Configurar Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Instalar dependencias
        working-directory: rios
        run: npm install

      - name: Instalar Chromium
        working-directory: rios
        run: npx playwright install --with-deps chromium

      - name: Probar acceso real a INA-CIRSA
        working-directory: rios
        env:
          INA_USERNAME: ${{ secrets.DGRIESGO }}
          INA_PASSWORD: ${{ secrets.SGA_DGR }}
        run: npm run diagnostico

      - name: Probar conexion de solo lectura con Google Sheets
        working-directory: rios
        env:
          SAT_RIOS_WEB_URL: ${{ secrets.SAT_RIOS_WEB_URL }}
          SAT_RIOS_WEB_TOKEN: ${{ secrets.SAT_RIOS_WEB_TOKEN }}
        run: node src/probar-conexion-sheets.js
